<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Phuc — Looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--ink:#2b2825;--soft:#6f6962;--faint:#a39b91;--line:#e3ddd4;--accent:#8a6d4f;--card:#fff;--gold:#b58f5b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1150px;margin:0 auto;padding:0 1.4rem}
header{text-align:center;padding:3.2rem 0 1.2rem}
header h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:2.4rem;letter-spacing:.28em;text-transform:uppercase;text-indent:.28em}
header .sub{margin-top:.5rem;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}
.rule{width:44px;height:1px;background:var(--accent);margin:1.2rem auto 0;border:none}
.coverage{text-align:center;font-size:.74rem;color:var(--soft);padding:.6rem 0 0}
.coverage b{color:var(--accent)}
.controls{display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center;padding:1.1rem 0 1.7rem;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.chip{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.42rem .95rem;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--soft);cursor:pointer;transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.look{margin:0 auto 2.4rem;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1.5fr 1fr}
.look .photos{background:#eee7dc;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.pcard{background:#fffaf3;border:1px solid #e6dccc;border-radius:10px;overflow:hidden}
.pcard .im{aspect-ratio:3/4;background:#fbf8f2;display:flex;align-items:center;justify-content:center;color:#b8aa99;font-size:.64rem;font-style:italic;overflow:hidden}
.pcard img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .role{font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:#9b7744;padding:5px 8px 0}
.pcard .nm{font-size:.66rem;line-height:1.25;padding:2px 8px 8px;font-weight:400}
.look .side{padding:24px 22px 20px}
.look .num{font-size:40pt;color:#e4d8c8;font-weight:200;line-height:.8;font-family:'Cormorant Garamond',serif}
.look .occ{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:6px 0 2px}
.look h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.45rem;line-height:1.12;margin-bottom:.6rem}
.look .why{font-size:.85rem;color:#312a23;margin-bottom:.7rem}
.look .note{background:#f2eadf;border-left:3px solid var(--gold);padding:.55rem .8rem;font-size:.74rem;color:#5b4b3d;margin-bottom:.7rem}
.look .avoid{font-size:.74rem;color:#9d3f35;margin-bottom:1.1rem}
.look .avoid b{letter-spacing:.14em;text-transform:uppercase;font-size:.6rem}
.verdicts{display:flex;gap:1.3rem;border-top:1px solid #eadfce;padding-top:.65rem;font-size:.72rem;color:#7a6b5c}
.verdicts label{cursor:pointer;display:flex;gap:.32rem;align-items:center}
.verdicts input{accent-color:var(--accent)}
footer{text-align:center;padding:1rem 0 2.4rem;font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
@media(max-width:760px){.look{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Looks</h1>
  <div class="sub">styled by Kimi K3 · full-closet coverage</div>
  <hr class="rule">
  <div class="coverage" id="coverage"></div>
</header>
<div class="controls" id="controls"></div>
<div id="looks"></div>
<footer>✦ tick keep / modify / no — tell natalie your picks</footer>
</div>
<script>
/* innerHTML is safe here: all JSON strings pass through esc() before insertion; data is a local read-only export */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LOOKS=[], ITEMS={}, OCC=[], cur='ALL';
const saved=JSON.parse(localStorage.getItem('lookVerdicts')||'{}');

async function boot(){
  const [l,w]=await Promise.all([
    fetch('./data/looks.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),
    fetch('./data/wardrobe.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json())
  ]);
  LOOKS=l; w.forEach(x=>ITEMS[x.id]=x);
  const order=['DATE','DINNER','WORK','SMART EVENT','CLUB','CASUAL','CASUAL DAY'];
  OCC=['ALL',...order.filter(o=>l.some(x=>x.occasion===o))];
  document.querySelector('#coverage').innerHTML=
    `<b>${l.length} looks</b> · every top in your closet has at least one full matched set · <b>${new Set(l.flatMap(x=>x.items.map(i=>i.id))).size}</b> unique items styled`;
  buildControls(); render();
}
function buildControls(){
  document.querySelector('#controls').innerHTML=OCC.map(o=>`<button class="chip ${o===cur?'on':''}" data-o="${esc(o)}">${esc(o)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cur=b.dataset.o;buildControls();render();});
}
function render(){
  const list=LOOKS.map((L,i)=>({L,i})).filter(({L})=>cur==='ALL'||L.occasion===cur);
  document.querySelector('#looks').innerHTML=list.map(({L,i})=>{
    const cards=L.items.map(it=>{
      const x=ITEMS[it.id]||{};
      const ph=x._img?`<img src="${esc(x._img)}" alt="">`:'no photo';
      return `<div class="pcard"><div class="im">${ph}</div><div class="role">${esc(it.role)}</div><div class="nm">${esc(x.name||'')}</div></div>`;
    }).join('');
    const v=saved[i]||'';
    return `<div class="look">
      <div class="photos">${cards}</div>
      <div class="side">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        <div class="occ">${esc(L.occasion)}</div>
        <h2>${esc(L.name)}</h2>
        <div class="why">${esc(L.why)}</div>
        ${L.stylist_note?`<div class="note">${esc(L.stylist_note)}</div>`:''}
        <div class="avoid"><b>Avoid</b> — ${esc(L.avoid)}</div>
        <div class="verdicts">
          ${['keep','modify','no'].map(x=>`<label><input type="radio" name="v${i}" ${v===x?'checked':''} onchange="setV(${i},'${x}')">${x}</label>`).join('')}
        </div>
      </div></div>`;
  }).join('') || '<p style="text-align:center;color:var(--faint);padding:2rem">no looks</p>';
}
window.setV=function(i,v){saved[i]=v;localStorage.setItem('lookVerdicts',JSON.stringify(saved));};
boot();
</script>
</body>
</html>
